<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#F0EFEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#2AA5A0" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#2AA5A0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2AA5A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Compass motif, large, subtle, top-right -->
  <g transform="translate(1100, 180)" opacity="0.55">
    <circle cx="200" cy="200" r="175" fill="none" stroke="#2AA5A0" stroke-width="3"/>
    <line x1="200" y1="20" x2="200" y2="50" stroke="#2AA5A0" stroke-width="2"/>
    <line x1="380" y1="200" x2="350" y2="200" stroke="#2AA5A0" stroke-width="2"/>
    <line x1="200" y1="380" x2="200" y2="350" stroke="#2AA5A0" stroke-width="2"/>
    <line x1="20" y1="200" x2="50" y2="200" stroke="#2AA5A0" stroke-width="2"/>
    <path d="M200 60 L260 200 L200 340 L140 200 Z" fill="#2AA5A0"/>
    <path d="M200 60 L260 200 L200 200 L140 200 Z" fill="#1D7A76"/>
  </g>

  <!-- Stack of subtle paper sheets, lower-left -->
  <g transform="translate(120, 460)">
    <rect x="0" y="60" width="540" height="320" rx="14" fill="#FFFFFF" stroke="#E5E4DF" stroke-width="2" transform="rotate(-3)"/>
    <rect x="20" y="40" width="540" height="320" rx="14" fill="#FFFFFF" stroke="#E5E4DF" stroke-width="2" transform="rotate(-1)"/>
    <rect x="40" y="20" width="540" height="320" rx="14" fill="#FFFFFF" stroke="#E5E4DF" stroke-width="2"/>
    <!-- checklist marks on top sheet -->
    <g transform="translate(80, 70)">
      <circle cx="10" cy="12" r="9" fill="#2AA5A0"/>
      <path d="M5 12 L9 16 L16 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="32" y="6" width="280" height="12" rx="3" fill="#1A1A1A" opacity="0.12"/>
      <rect x="32" y="22" width="180" height="8" rx="3" fill="#1A1A1A" opacity="0.07"/>
    </g>
    <g transform="translate(80, 130)">
      <circle cx="10" cy="12" r="9" fill="#2AA5A0"/>
      <path d="M5 12 L9 16 L16 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="32" y="6" width="320" height="12" rx="3" fill="#1A1A1A" opacity="0.12"/>
      <rect x="32" y="22" width="220" height="8" rx="3" fill="#1A1A1A" opacity="0.07"/>
    </g>
    <g transform="translate(80, 190)">
      <circle cx="10" cy="12" r="9" fill="#2AA5A0"/>
      <path d="M5 12 L9 16 L16 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="32" y="6" width="240" height="12" rx="3" fill="#1A1A1A" opacity="0.12"/>
      <rect x="32" y="22" width="160" height="8" rx="3" fill="#1A1A1A" opacity="0.07"/>
    </g>
    <g transform="translate(80, 250)">
      <circle cx="10" cy="12" r="9" fill="none" stroke="#1D7A76" stroke-width="2"/>
      <rect x="32" y="6" width="300" height="12" rx="3" fill="#1A1A1A" opacity="0.08"/>
    </g>
  </g>
</svg>
